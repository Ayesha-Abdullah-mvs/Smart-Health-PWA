<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Vitals</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="vitals.css" />
</head>
<body data-page = "vitals">
    <nav class="bottom-nav">
        <button data-page="dashboard">
            <span>🏠</span>
            <small>Home</small>
        </button>
        <button data-page="vitals">
            <span>❤️</span>
            <small>Vitals</small>
        </button>
        <button data-page="medications">
            <span>💊</span>
            <small>Meds</small>
        </button>
        <button data-page="reports">
            <span>📊</span>
            <small>Reports</small>
        </button>
        <button data-page="steps">
            <span>👣</span>
            <small>Steps</small>
        </button>
    </nav>
    
    <div class="page-container container"> <div class="card">
        <div class="card-header">
            <h2 class="text-2xl">Record Vitals</h2>
        </div>
        
        <div class="card-content">
            <form id="vitalsForm" class="space-y-6">
                <div class="input-group">
                    <label class="label">Blood Pressure</label>
                    <input type="text" id="bp" class="input-field" placeholder="120/80" required />
                </div>

                <div class="input-group">
                    <label class="label">Heart Rate (bpm)</label>
                    <input type="number" id="hr" class="input-field" placeholder="90" required />
                </div>

                <div class="input-group">
                    <label class="label">Temperature (°C)</label>
                    <input type="number" step="0.1" id="temp" class="input-field" placeholder="35.5" required />
                </div>

                <button type="submit" class="btn btn-primary">Save Vitals</button>
            </form>
            <p id="statusMsg" class="text-center font-bold"></p>
        </div>
    </div>
</div>
    <script src="bottom-nav.js"></script>
    <script src="vitals.js"></script>
</body>
</html>
